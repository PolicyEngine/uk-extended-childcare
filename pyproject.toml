[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-extended-childcare"
version = "0.1.0"
description = "Scoring the NEF Universal Family Childcare Promise with PolicyEngine UK."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "microdf-python>=1.2.0",
]

[project.optional-dependencies]
simulation = [
  # The [uk] extra exact-pins policyengine-uk and policyengine_core, so the
  # bundle version alone determines the whole simulation stack.
  "policyengine[uk]>=4.20.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
uk-extended-childcare-build = "uk_extended_childcare.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/uk-extended-childcare"
Repository = "https://github.com/PolicyEngine/uk-extended-childcare"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_extended_childcare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
